name: Update widget

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-widget

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download SVG
        env:
          WIDGET_URL: ${{ vars.WIDGET_URL }}
        run: |
          mkdir -p assets
          curl --fail --show-error --location --retry 3 \
            "${WIDGET_URL%/}/?theme=light" -o assets/light.svg
          curl --fail --show-error --location --retry 3 \
            "${WIDGET_URL%/}/?theme=dark" -o assets/dark.svg

      - name: Commit changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add assets/light.svg assets/dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update widget"
          git push
